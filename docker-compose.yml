services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html # Mapea tu código directamente para verlo en tiempo real
    environment:
      APP_NAME: "Sistema UGDA"
      APP_ENV: local
      #APP_KEY: base64:W5I6LIKfVQeHxTuJ2is7/KmFtj6MELulEjXGcUI8LrY=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/El_Salvador
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sistema_ugda
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@ugda.local
      MAIL_FROM_NAME: "Sistema UGDA"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"] # Comando estándar para levantar Laravel

  scheduler:
    image: sistema-ugda-fia-ues-app:latest
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - scheduler_vendor:/var/www/html/vendor
    environment:
      APP_NAME: "Sistema UGDA"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/El_Salvador
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sistema_ugda
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["sh", "-lc", "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi; exec php artisan schedule:work"]

  vite:
    image: node:20-alpine # Cambiamos la imagen de PHP por una de Node oficial para Vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: "Sistema UGDA"
      APP_ENV: local
      #APP_KEY: base64:W5I6LIKfVQeHxTuJ2is7/KmFtj6MELulEjXGcUI8LrY=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"] # Comando estándar para levantar el servidor de Vite

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sistema_ugda
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sistema_ugda"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  scheduler_vendor:
  postgres_data: # Únicamente dejamos el volumen de la Base de Datos para que no pierdas tu información
